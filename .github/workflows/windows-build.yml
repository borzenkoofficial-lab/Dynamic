name: Windows build

concurrency:
  group: dynamic-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Dynamic/Dynamic.csproj
      - name: Build
        run: dotnet build src/Dynamic/Dynamic.csproj --configuration Release --no-restore

name: Windows build and installer

concurrency:
  group: dynamic-windows-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore app
        run: dotnet restore src/Dynamic/Dynamic.csproj

      - name: Restore tests
        run: dotnet restore tests/Dynamic.Tests/Dynamic.Tests.csproj

      - name: Run tests
        run: dotnet test tests/Dynamic.Tests/Dynamic.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=dynamic-tests.trx"

      - name: Publish self-contained Windows x64 app
        run: dotnet publish src/Dynamic/Dynamic.csproj --configuration Release --runtime win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/publish

      - name: Verify published XAML resources
        shell: pwsh
        run: |
          $pri = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\Dynamic.pri"
          if (-not (Test-Path $pri)) {
            Write-Host "Publish directory:"
            Get-ChildItem "artifacts\publish" | Select-Object Name, Length
            throw "Dynamic.pri is missing from the publish output. The installer must not be produced."
          }
          Get-Item $pri | Select-Object FullName, Length

      - name: Verify real Windows startup
        shell: pwsh
        run: ./tools/Test-DynamicStartup.ps1 -ExecutablePath "artifacts/publish/Dynamic.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $publish = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish"
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          & $iscc "/DAppVersion=0.1.${{ github.run_number }}" "/DPublishDir=$publish" "/DOutputDir=$output" installer\Dynamic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed Setup launches
        shell: pwsh
        run: |
          $setup = Join-Path $env:GITHUB_WORKSPACE "artifacts\\Dynamic-Setup-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "Dynamic-Smoke-Install"
          $setupProcess = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            throw "Dynamic Setup failed with exit code $($setupProcess.ExitCode)."
          }

          try {
            $installedExe = Join-Path $installDir "Dynamic.exe"
            $installedPri = Join-Path $installDir "Dynamic.pri"
            if (-not (Test-Path $installedExe)) { throw "Installed Dynamic.exe is missing." }
            if (-not (Test-Path $installedPri)) { throw "Installed Dynamic.pri is missing." }
            ./tools/Test-DynamicStartup.ps1 -ExecutablePath $installedExe
          }
          finally {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (Test-Path $uninstaller) {
              $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @(
                "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
              ) -Wait -PassThru
              if ($uninstallProcess.ExitCode -ne 0) {
                Write-Warning "Dynamic smoke-test cleanup exited with code $($uninstallProcess.ExitCode)."
              }
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-Setup-x64
          path: artifacts/Dynamic-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable publish folder
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-portable-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable prerelease
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dynamic-build-${{ github.run_number }}
          name: Dynamic build 0.1.${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: artifacts/Dynamic-Setup-x64.exe

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dynamic-test-results
          path: '**/dynamic-tests.trx'
          if-no-files-found: ignore
          retention-days: 14
